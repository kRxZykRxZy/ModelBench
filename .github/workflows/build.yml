name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install aqtinstall
        run: pip install aqtinstall
      - name: Install Qt
        run: aqt install-qt windows desktop 6.8.3 win64_mingw -O C:\Qt
      - name: Configure
        run: cmake --preset windows-mingw-debug -DCMAKE_PREFIX_PATH=C:/Qt/6.8.3/mingw_64
      - name: Build
        run: cmake --build --preset windows-mingw-debug

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install aqtinstall
        run: pip install aqtinstall
      - name: Install Qt
        run: aqt install-qt mac desktop 6.8.3 clang_64 -O /opt/Qt
      - name: Configure
        run: cmake --preset macos-arm64 -DCMAKE_PREFIX_PATH=/opt/Qt/6.8.3/macos
      - name: Build
        run: cmake --build --preset macos-arm64
