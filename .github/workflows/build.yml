name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          setup-python: false
      - name: Configure
        run: cmake --preset windows-mingw-debug
      - name: Build
        run: cmake --build --preset windows-mingw-debug -j 4
      - name: Deploy Qt (bundle DLLs)
        run: |
          cd build/windows-mingw-debug
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime ModelBench.exe
      - name: Upload ModelBench (self-contained)
        uses: actions/upload-artifact@v4
        with:
          name: ModelBench-windows
          path: |
            build/windows-mingw-debug/ModelBench.exe
            build/windows-mingw-debug/*.dll
            build/windows-mingw-debug/*.qml
            build/windows-mingw-debug/platforms/
            build/windows-mingw-debug/imageformats/
            build/windows-mingw-debug/iconengines/
            build/windows-mingw-debug/styles/
            build/windows-mingw-debug/sqldrivers/
            build/windows-mingw-debug/networkinformation/
            build/windows-mingw-debug/tls/
            build/windows-mingw-debug/qml/
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          setup-python: false
      - name: Configure
        run: cmake --preset macos-arm64
      - name: Build
        run: cmake --build --preset macos-arm64 -j 4
      - name: Deploy Qt (bundle frameworks)
        run: |
          cd build/macos-arm64
          macdeployqt ModelBench.app
      - name: Upload ModelBench macOS
        uses: actions/upload-artifact@v4
        with:
          name: ModelBench-macos
          path: build/macos-arm64/ModelBench.app
          if-no-files-found: warn
