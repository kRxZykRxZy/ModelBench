name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install aqtinstall
        run: pip install aqtinstall
      - name: Install Qt
        run: aqt install-qt windows desktop 6.8.3 win64_mingw -O C:\Qt
      - name: Install MinGW 13.1.0 toolchain (matches Qt 6.8.3)
        run: aqt install-tool windows desktop tools_mingw1310 -O C:\
      - name: Configure
        run: |
          $env:PATH = "C:\Tools\mingw1310_64\bin;$env:PATH"
          cmake --preset windows-mingw-debug -DCMAKE_PREFIX_PATH=C:/Qt/6.8.3/mingw_64 -DMODELFIT_ENABLE_LLAMA_CPP=ON
      - name: Build
        run: |
          $env:PATH = "C:\Tools\mingw1310_64\bin;$env:PATH"
          cmake --build --preset windows-mingw-debug -j 4
      - name: Deploy Qt (bundle DLLs)
        run: |
          cd build/windows-mingw-debug/bin
          C:\Qt\6.8.3\mingw_64\bin\windeployqt.exe --release --qmldir ${{ github.workspace }}/app/ui --no-translations --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime ModelBench.exe
      - name: Upload ModelBench (self-contained)
        uses: actions/upload-artifact@v4
        with:
          name: ModelBench-windows
          path: |
            build/windows-mingw-debug/bin/
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install aqtinstall
        run: pip install aqtinstall
      - name: Install Qt
        run: sudo aqt install-qt mac desktop 6.8.3 clang_64 -O /opt/Qt
      - name: Configure
        run: cmake --preset macos-arm64 -DCMAKE_PREFIX_PATH=/opt/Qt/6.8.3/macos -DMODELFIT_ENABLE_LLAMA_CPP=ON
      - name: Build
        run: cmake --build --preset macos-arm64 -j 4
      - name: Deploy Qt (bundle frameworks)
        run: |
          cd build/macos-arm64/bin
          /opt/Qt/6.8.3/macos/bin/macdeployqt ModelBench.app
      - name: Upload ModelBench macOS
        uses: actions/upload-artifact@v4
        with:
          name: ModelBench-macos
          path: build/macos-arm64/bin/ModelBench.app
          if-no-files-found: warn