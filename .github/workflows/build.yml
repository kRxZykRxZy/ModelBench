name: Build

on: [push, pull_request]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install aqtinstall
        run: pip install aqtinstall
      - name: Install Qt
        run: aqt install-qt windows desktop 6.12.0 win64_mingw -O C:\Qt
      - name: Configure
        run: cmake --preset windows-mingw-debug
        env:
          CMAKE_PREFIX_PATH: C:\Qt\6.12.0\mingw_64
      - name: Build
        run: cmake --build --preset windows-mingw-debug
      - name: Test
        run: ctest --preset windows-mingw-debug
        env:
          PATH: C:\Qt\6.12.0\mingw_64\bin;${{ env.PATH }}

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install aqtinstall
        run: pip install aqtinstall
      - name: Install Qt
        run: aqt install-qt mac desktop 6.12.0 clang_64 -O /opt/Qt
      - name: Configure
        run: cmake --preset macos-arm64
        env:
          CMAKE_PREFIX_PATH: /opt/Qt/6.12.0/macos
      - name: Build
        run: cmake --build --preset macos-arm64
      - name: Test
        run: ctest --preset macos-arm64
